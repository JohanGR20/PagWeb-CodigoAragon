services:
  - type: web
    name: codigo-aragon-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Código Aragón API
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: COMPANY_EMAIL
        value: codigoaragon845@gmail.com
      - key: COMPANY_PHONE
        value: "5615431206"
      - key: WHATSAPP_NUMBER
        value: "5215615431206"
      - key: ENABLE_BACKGROUND_TASKS
        value: "false"
